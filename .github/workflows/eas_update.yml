on:
  # Manuel : une mise à jour OTA part directement chez les utilisateurs du Play Store
  workflow_dispatch:
    inputs:
      message:
        description: Description de la mise à jour
        required: true
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v5

      - name: 🏗 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Create update
        run: eas update --channel production --message "${{ inputs.message }}" --non-interactive --platform android